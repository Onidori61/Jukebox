  <style>
    :root{color-scheme:dark}
    body{--page:#100b0a;--panel:#1b1210;--panel-raised:#241714;--line:rgba(255,255,255,.1);--primary-text:#f5f2f1;--secondary-text:#a99f9c;--accent:#e11d2e;--accent-soft:rgba(225,29,46,.13);position:relative;isolation:isolate;min-height:100vh;background:#100c0b!important;color:var(--primary-text)!important;font-family:Inter,sans-serif;padding-bottom:28px}
    body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;background-image:url("assets/halloween-wallpaper.png");background-size:180px 180px}
    body.theme-halloween{--page:#0c0a09;--panel:#171513;--panel-raised:#211c18;--line:rgba(251,146,60,.18);--primary-text:#fff7ed;--secondary-text:#c4b9ae;--accent:#f97316;--accent-soft:rgba(249,115,22,.14);background:#0c0a09!important}

    body.theme-halloween #close-rules:disabled{background:#3b2c20!important;color:#c4b9ae!important}
    body *{scrollbar-color:#59413a transparent}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
    .doodle{position:relative;background:rgba(27,18,16,.72)!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:0 16px 40px rgba(0,0,0,.2)!important;backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15)}
    .doodle:after{display:none!important}
    .music-header{position:sticky!important;top:0;z-index:40;height:64px!important;background:rgba(15,10,9,.94)!important;border-color:var(--line)!important;box-shadow:0 1px 18px rgba(0,0,0,.24)!important;color:var(--primary-text)!important}
    #album-atmosphere{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#100c0b}
    #album-atmosphere img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;object-position:center 62%;opacity:.55;filter:blur(68px) saturate(1.35) brightness(.65);transform:scale(1.12);transition:opacity .7s ease}
    #album-atmosphere:after{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,12,11,.4),rgba(16,12,11,.56) 48%,rgba(11,8,7,.78));content:""}
    body.theme-halloween #album-atmosphere:after{background-image:url("assets/halloween-wallpaper.png"),linear-gradient(rgba(0,0,0,.40),rgba(0,0,0,.18)),linear-gradient(180deg,rgba(9,7,6,.76),rgba(9,7,6,.84) 48%,rgba(3,3,3,.94));background-repeat:repeat,no-repeat,no-repeat;background-size:180px 180px,cover,cover;background-blend-mode:screen,normal,normal}

    .header-actions{gap:8px!important}
    #rules-info{display:inline-flex;align-items:center;gap:5px;padding:7px 10px!important;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05)!important;color:#e6dcda!important;font-size:11px;font-weight:600}
    #rules-info:hover{background:rgba(255,255,255,.1)!important}
    .online-pill{background:rgba(255,255,255,.05)!important;border-color:var(--line)!important;color:#e6dcda!important}

    body.theme-halloween #request-status[data-state="maintenance"]{border-color:rgba(251,191,36,.24);background:rgba(245,158,11,.1);color:#fde68a}

    #search-results{position:absolute!important;z-index:30;left:0;right:0;width:100%;box-sizing:border-box;margin-top:8px!important;max-height:256px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line)!important;border-radius:14px;background-color:#1b1210!important;color:var(--primary-text)!important;box-shadow:0 18px 38px rgba(0,0,0,.62)!important;backdrop-filter:blur(18px)}

    #search-results button>img{width:48px;height:48px;flex:none;border-radius:10px}
